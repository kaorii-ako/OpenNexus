[project]
name = "opennexus-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.21",
  "chromadb>=0.5",
  "httpx>=0.27",
  "typer[all]>=0.12",
  "rich>=13",
  "apscheduler>=3.10",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.140",
  "PyGithub>=2.3",
  "feedparser>=6.0",
  "aiofiles>=23",
  "pydantic>=2",
  "openai>=1.30",
  "anthropic>=0.28",
  "questionary>=2.0",
  "tzlocal>=5.0",
  "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["backend*", "cli*"]

[project.scripts]
nexus = "cli.main:app"
